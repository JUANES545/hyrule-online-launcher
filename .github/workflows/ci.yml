name: CI

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [develop, 'release/**', 'hotfix/**', 'feature/**', 'bugfix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\scripts\Build.ps1
      - name: Test
        shell: powershell
        run: .\scripts\Test.ps1
      - name: Package
        shell: powershell
        run: .\scripts\Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: portable-package
          path: .artifacts/dist/*.zip
          retention-days: 7
